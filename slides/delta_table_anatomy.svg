<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .h1    { font-size: 30px; font-weight: 600; fill: #1B2432; }
    .sub   { font-size: 15px; font-weight: 400; fill: #7A8699; }
    .panel { font-size: 13px; font-weight: 600; fill: #1B2432; letter-spacing: 0.2px; }
    .file  { font-size: 14px; font-weight: 500; fill: #1B2432; }
    .filed { font-size: 14px; font-weight: 400; fill: #96A1B2; }
    .meta  { font-size: 11.5px; font-weight: 400; fill: #7A8699; }
    .ver   { font-size: 13px; font-weight: 700; fill: #FFFFFF; }
    .op    { font-size: 14.5px; font-weight: 600; fill: #1B2432; }
    .note  { font-size: 15px; font-weight: 400; fill: #1B2432; }
    .add   { font-size: 11.5px; font-weight: 500; fill: #106B74; }
    .rem   { font-size: 11.5px; font-weight: 500; fill: #A8536B; }
  </style>

  <rect width="1000" height="560" fill="#FFFFFF"/>

  <text class="h1" x="48" y="54">A Delta table is files plus a log</text>
  <text class="sub" x="48" y="80">Nothing is edited in place. Changes append new files and commit a new version.</text>

  <line x1="48" y1="104" x2="952" y2="104" stroke="#D8DEE7" stroke-width="1"/>

  <!-- ============ LEFT: object storage ============ -->
  <text class="panel" x="48" y="136">Parquet files in cloud storage</text>

  <!-- part-0001 : superseded -->
  <rect x="48" y="152" width="392" height="52" rx="4" fill="#F4F6F9" stroke="#CBD3DE" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="filed" x="72" y="176">part-0001.parquet</text>
  <text class="meta"  x="72" y="193">1,240 rows · superseded at v2</text>

  <!-- part-0002 : live -->
  <rect x="48" y="214" width="392" height="52" rx="4" fill="#FFFFFF" stroke="#1B2432" stroke-width="1.4"/>
  <rect x="48" y="214" width="5" height="52" rx="2" fill="#106B74"/>
  <text class="file" x="72" y="238">part-0002.parquet</text>
  <text class="meta" x="72" y="255">1,318 rows</text>

  <!-- part-0003 : superseded -->
  <rect x="48" y="276" width="392" height="52" rx="4" fill="#F4F6F9" stroke="#CBD3DE" stroke-width="1" stroke-dasharray="4 3"/>
  <text class="filed" x="72" y="300">part-0003.parquet</text>
  <text class="meta"  x="72" y="317">1,190 rows · superseded at v1</text>

  <!-- part-0004 : live -->
  <rect x="48" y="338" width="392" height="52" rx="4" fill="#FFFFFF" stroke="#1B2432" stroke-width="1.4"/>
  <rect x="48" y="338" width="5" height="52" rx="2" fill="#106B74"/>
  <text class="file" x="72" y="362">part-0004.parquet</text>
  <text class="meta" x="72" y="379">1,190 rows · rewritten by the update</text>

  <!-- part-0005 : live -->
  <rect x="48" y="400" width="392" height="52" rx="4" fill="#FFFFFF" stroke="#1B2432" stroke-width="1.4"/>
  <rect x="48" y="400" width="5" height="52" rx="2" fill="#106B74"/>
  <text class="file" x="72" y="424">part-0005.parquet</text>
  <text class="meta" x="72" y="441">1,102 rows · rewritten by the delete</text>

  <!-- ============ MIDDLE: pointer arrows ============ -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#106B74"/>
    </marker>
  </defs>

  <path d="M 452 240 C 505 240, 535 180, 590 180" stroke="#106B74" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 452 364 C 505 364, 535 266, 590 266" stroke="#106B74" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M 452 426 C 505 426, 535 352, 590 352" stroke="#106B74" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ RIGHT: transaction log ============ -->
  <text class="panel" x="592" y="136">_delta_log — ordered commits</text>

  <line x1="608" y1="160" x2="608" y2="452" stroke="#D8DEE7" stroke-width="2"/>

  <!-- v0 -->
  <circle cx="608" cy="180" r="15" fill="#1B2432"/>
  <text class="ver" x="608" y="185" text-anchor="middle">v0</text>
  <text class="op"  x="638" y="177">CREATE TABLE AS SELECT</text>
  <text class="add" x="638" y="196">+ adds part-0001, part-0002, part-0003</text>

  <!-- v1 -->
  <circle cx="608" cy="266" r="15" fill="#1B2432"/>
  <text class="ver" x="608" y="271" text-anchor="middle">v1</text>
  <text class="op"  x="638" y="263">UPDATE</text>
  <text class="rem" x="638" y="282">− removes part-0003</text>
  <text class="add" x="638" y="299">+ adds part-0004</text>

  <!-- v2 -->
  <circle cx="608" cy="352" r="15" fill="#106B74"/>
  <text class="ver" x="608" y="357" text-anchor="middle">v2</text>
  <text class="op"  x="638" y="349">DELETE</text>
  <text class="rem" x="638" y="368">− removes part-0001</text>
  <text class="add" x="638" y="385">+ adds part-0005</text>

  <text class="meta" x="638" y="410">current version</text>

  <!-- ============ BOTTOM ============ -->
  <line x1="48" y1="486" x2="952" y2="486" stroke="#D8DEE7" stroke-width="1"/>
  <text class="note" x="48" y="516">The table is not the folder of files. It is the files the log currently points to —</text>
  <text class="note" x="48" y="538">which is why a query can ask for v0 and still get a complete, consistent answer.</text>
</svg>
